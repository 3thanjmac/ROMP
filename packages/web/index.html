<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
		/>
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="ROMP" />
		<!--
			No apple-mobile-web-app-status-bar-style. With black-translucent, iOS 26+ Home Screen apps draw a blur
			over the status bar that spills onto the title bar, and size the web view a status bar short, leaving a
			blank strip at the bottom. Without it the status bar sits above the page in the page's colour and
			env(safe-area-inset-top) is 0. iOS reads this at install: re-add the app to the Home Screen after changing it.
		-->
		<!-- Literal copy of the dark --bg token in src/styles/tokens.css: oklch(0.16 0.008 255) -->
		<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b0d11" />
		<!-- Literal copy of the light --bg token in src/styles/tokens.css: oklch(0.975 0.003 255) -->
		<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f5f7f9" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<link rel="icon" href="/icon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="/icon-180.png" />
		<title>ROMP</title>
	</head>
	<body>
		<div id="app"></div>
		<script type="module" src="/src/main.ts"></script>
	</body>
</html>
