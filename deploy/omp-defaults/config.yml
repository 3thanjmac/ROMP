theme:
  dark: titanium
  light: light
setupVersion: 2
defaultThinkingLevel: auto
retry:
  waitForUsageReset: true
  maxDelayMs: 0
modelRoles:
  smol: anthropic/claude-haiku-5-5:high
  tiny: anthropic/claude-haiku-5-5:medium
  designer: openrouter/moonshotai/kimi-k3.1-pro:max
  vision: openrouter/moonshotai/kimi-k3.1-pro:max
  advisor: openrouter/z-ai/glm-5.3-flash:max
  default: anthropic/claude-opus-5-5:high
  slow: anthropic/claude-fable-5-1
task:
  enableEffort: true
  maxEffort: high
  showResolvedModelBadge: true
  agentModelOverrides:
    scout: "@smol"
    sonic: "@smol"
    task: "@default"
    reviewer: "@slow:high"
    security-reviewer: "@slow:high"
  disabledAgents:
    - designer
  softRequestBudget: 80
disabledExtensions: []
tools:
  approvalMode: yolo
  approval:
    bash: allow
    eval: allow
    task: allow
    hub: allow
    browser: allow
    debug: allow
    ast_edit: allow
lsp:
  diagnosticsOnWrite: true
  diagnosticsOnEdit: true
github:
  enabled: true
cycleOrder:
  - default
  - smol
  - designer
  - tiny
  - advisor
memory:
  backend: local
autolearn:
  enabled: true
bashInterceptor:
  enabled: true
  patterns:
    - pattern: ^\s*(pnpm|npm|yarn|bun|npx|pnpx|vite|nodemon)\s+(run\s+)?(dev|start|serve|watch|preview)\b
      tool: hub
      message: 'A dev server is almost certainly already running: list its port with `node ~/.omp/agent/bin/dev-servers.mjs` and reuse it. Only when nothing is listening, start a supervised process with the `hub` tool (op:"start").'
bash:
  patterns:
    - match: "*env.prod*"
      approval: deny
    - match: "*--no-preserve-root*"
      approval: deny
    - match: "*shred /dev/*"
      approval: deny
